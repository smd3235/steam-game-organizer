[package]
name = "steam-game-organizer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# JSON serialization for settings, rollback journal, scan state
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Date parsing for Steam release dates (release_label)
chrono = "0.4.45"

# Lazy static for compiled regexes reused across calls
lazy_static = "1.5.1"

# Filename normalization tags (normalize_name)
regex = "1"

# Junction-safe recursive directory walk
walkdir = "2.5.1"

# ZIP archive reading for encryption checks
zip = "9.8.2"

# HTTP client for Steam API calls (blocking client for connection pool)
reqwest = { version = "0.13.5", features = ["blocking"] }

# Windows registry access for .html handler check (organizer_service)
winreg = "0.56.0"

# egui GUI framework for the UI layer
egui = "0.32"
eframe = { version = "0.32", features = ["glow"] }

# CLI argument parsing for headless binary
clap = { version = "4.6.10", features = ["derive"] }

# Native file dialogs for browse buttons in setup view
rfd = "0.18.0"

[dev-dependencies]
tempfile = "3.27.0"
[workspace]

[[bin]]
name = "steam-game-organizer"
path = "src/bin.rs"

[[bin]]
name = "capture_screens"
path = "src/tools/capture_screens.rs"
