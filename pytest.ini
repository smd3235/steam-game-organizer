[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
norecursedirs = .git build dist __pycache__ .venv venv
markers =
    frozen: tests that rebuild the frozen exe (slow, ~19s)
    integration: end-to-end workflow tests (slow, ~18s)
    geometry: window size/minimum size tests (~12s)
    slow: any test taking >1s per test
    network: tests that make real network calls
    ui: tests that require Tkinter window
    unit: fast unit tests (default when no marker)
    notkinter: tests that do NOT use tkinter (safe for parallel execution)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Parallel execution strategy:
# Non-tkinter tests (503 tests): pytest -m "notkinter" -n auto --dist=loadfile
# Tkinter tests (12 test files): pytest -m "ui" (sequential)
# Frozen/Integration: pytest -m "frozen or integration" (sequential)