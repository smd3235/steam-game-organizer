<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252d3a"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b82ff"/>
      <stop offset="1" stop-color="#7353f5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#303949" stroke-width="4" opacity="0.55"/>

  <!-- Folder back, with the raised tab that makes the silhouette read as a folder and not a box. -->
  <path d="M112 214 L112 176 Q112 156 132 156 L206 156 Q222 156 230 172 L246 190
           L396 190 Q416 190 416 210 L416 352 Q416 372 396 372 L132 372 Q112 372 112 352 Z"
        fill="#1e2430" stroke="#303949" stroke-width="6" stroke-linejoin="round"/>

  <!-- Game cases going in. Drawn behind the folder front so they sit inside it. -->
  <g>
    <rect x="146" y="118" width="54" height="132" rx="12" fill="#39c6d8"/>
    <rect x="214" y="96" width="54" height="154" rx="12" fill="#48d597"/>
    <rect x="282" y="126" width="54" height="124" rx="12" fill="#ffb454"/>
    <rect x="160" y="136" width="26" height="6" rx="3" fill="#0f1117" opacity="0.35"/>
    <rect x="228" y="114" width="26" height="6" rx="3" fill="#0f1117" opacity="0.35"/>
    <rect x="296" y="144" width="26" height="6" rx="3" fill="#0f1117" opacity="0.35"/>
  </g>

  <!-- Folder front. -->
  <path d="M88 236 L424 236 L406 396 Q404 406 392 406 L120 406 Q108 406 106 396 Z"
        fill="url(#front)"/>
  <path d="M88 236 L424 236 L421 254 L91 254 Z" fill="#ffffff" opacity="0.18"/>
</svg>