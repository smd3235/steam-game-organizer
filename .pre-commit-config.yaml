repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest suite
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true

      - id: mypy
        name: Run mypy type check
        entry: runtime\python.exe -m mypy ui/review_view.py core/models.py --ignore-missing-imports --follow-imports=skip
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        verbose: true

      - id: bandit
        name: Run bandit security scan
        entry: runtime\Scripts\bandit.exe -r core services ui app utils --severity-level medium --confidence-level medium
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        verbose: true

      - id: ocr-test
        name: Run OCR UI tests
        entry: runtime\python.exe tools\ocr_test.py --size 1600x1000 --no-capture --out temp/ocr-precommit
        language: system
        types: [png]
        pass_filenames: false
        always_run: false
        verbose: true
